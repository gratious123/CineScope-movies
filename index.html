<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineScope</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #141414; color: #fff; margin: 0; padding: 20px; }
        h1 { color: #e50914; }
        .container { display: flex; gap: 20px; }
        .movie-list { flex: 1; }
        .movie-card { background: #1f1f1f; padding: 15px; margin-bottom: 10px; border-radius: 5px; cursor: pointer; transition: background 0.2s; }
        .movie-card:hover { background: #333; }
        .player-container { flex: 2; background: #1f1f1f; padding: 20px; border-radius: 5px; text-align: center; }
        video { width: 100%; max-height: 400px; background: #000; border-radius: 4px; }
    </style>
</head>
<body>

    <h1>CineScope Movies</h1>
    
    <div class="container">
        <!-- Movie Catalog -->
        <div class="movie-list">
            <h3>Available Movies</h3>
            <div id="movies">Loading movies...</div>
        </div>

        <!-- Video Player Section -->
        <div class="player-container">
            <h3 id="now-playing">Select a movie to watch</h3>
            <video id="videoPlayer" controls>
                Your browser does not support HTML5 video.
            </video>
        </div>
    </div>

    <script>
        async function fetchMovies() {
            try {
                const response = await fetch('http://localhost:3000/api/movies');
                const movies = await response.json();
                const moviesDiv = document.getElementById('movies');
                moviesDiv.innerHTML = '';

                movies.forEach(movie => {
                    const card = document.createElement('div');
                    card.className = 'movie-card';
                    card.innerHTML = `<strong>${movie.title}</strong> (${movie.year}) - <em>${movie.genre}</em>`;
                    card.onclick = () => playMovie(movie);
                    moviesDiv.appendChild(card);
                });
            } catch (error) {
                document.getElementById('movies').innerText = 'Failed to load movies. Is the backend running?';
            }
        }

        function playMovie(movie) {
            document.getElementById('now-playing').innerText = `Now Playing: ${movie.title}`;
            const player = document.getElementById('videoPlayer');
            player.src = movie.videoUrl;
            player.play();
        }

        fetchMovies();
    </script>

</body>
</html>
